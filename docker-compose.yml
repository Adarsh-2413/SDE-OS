version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sde_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sde_os_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sde_os_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sde_os_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sde_os_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://admin:password123@postgres:5432/sde_os_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "sde_career_os_super_secret_jwt_key_prod_2026"
      JWT_REFRESH_SECRET: "sde_career_os_super_secret_refresh_key_prod_2026"
      CLOUDINARY_CLOUD_NAME: "Root"
      CLOUDINARY_API_KEY: "298499419458157"
      CLOUDINARY_API_SECRET: "uSbx-WtjIRfH5XLS8BTS8MxR84s"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sde_os_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
